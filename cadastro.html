<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | Raízes do Nordeste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo-link">
      <div class="logo">
        🌵 <span>Raízes do Nordeste</span>
      </div>
    </a>

    <div class="usuario-area">
      <div class="usuario-deslogado">
        <a href="login.html" class="btn-login">Entrar</a>
      </div>
    </div>
  </header>

  <div class="cadastro-container">
    <div class="cadastro-banner">
      <img src="assets/logo.jpg" alt="Raízes do Nordeste">
      <h1>Crie sua conta</h1>
      <p>
        Cadastre-se para acumular pontos, acompanhar seus pedidos e receber promoções exclusivas.
      </p>
    </div>

    <div class="cadastro-card">
      <h2>Novo Cadastro</h2>
      <form id="formCadastro">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" maxlength="15" placeholder="(00) 00000-0000" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="********" required>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" placeholder="********" required>
        </div>

        <label class="lgpd">
          <input type="checkbox" id="aceiteLgpd" required>
          <span>
            Li e concordo com o tratamento dos meus dados pessoais para fins de cadastro, programa de fidelidade e comunicação, conforme a LGPD.
          </span>
        </label>

        <button type="submit" class="btn-primary">
          Criar Conta
        </button>
      </form>
      <p class="login-link">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script src="js/cadastro.js"></script>
</body>

</html>
